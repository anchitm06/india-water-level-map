name: Probe India-WRIS

# Checks whether India-WRIS is reachable from GitHub-hosted runners and, if so, runs the
# fetcher's --discover step. Triggers on manual dispatch and on pushes to the working branch
# that touch this file or the fetcher.
on:
  workflow_dispatch:
  push:
    branches: [ccr-4885ee13-synmjo]
    paths: [.github/workflows/probe-wris.yml, pipeline/fetch.py]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Runner egress IP
        run: curl -sS -m 20 https://api.ipify.org || true
      - name: Reachability
        id: reach
        run: |
          for u in https://indiawris.gov.in/ https://indiawris.gov.in/swagger-ui/index.html https://data.gov.in/; do
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$u" 2>&1 || true)
            echo "$u -> $code"
          done
          if curl -sS -m 30 -o /dev/null https://indiawris.gov.in/; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Discover master endpoints
        if: steps.reach.outputs.ok == 'true'
        run: |
          pip install -r pipeline/requirements.txt
          python pipeline/fetch.py --discover | tee discover.txt
      - uses: actions/upload-artifact@v4
        if: steps.reach.outputs.ok == 'true'
        with: { name: discover, path: discover.txt }
